<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crownPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="glowP">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="90" fill="url(#purpleGlow)"/>

  <!-- Glowing Tennis Ball on Right -->
  <circle cx="165" cy="115" r="14" fill="#a855f7" filter="url(#glowP)"/>
  <path d="M 153 115 A 12 12 0 0 1 177 115" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Royal Arch Circle -->
  <circle cx="100" cy="100" r="46" fill="#2e1065" stroke="url(#crownPurple)" stroke-width="3" filter="url(#glowP)"/>

  <!-- Imperial Crown -->
  <g filter="url(#glowP)" fill="url(#crownPurple)" stroke="#ffffff" stroke-width="1.5">
    <!-- 5 Points of Crown -->
    <path d="M 68 122 L 72 90 L 84 104 L 100 75 L 116 104 L 128 90 L 132 122 Z" />
    
    <!-- Jewels on Peaks -->
    <circle cx="72" cy="87" r="3.5" fill="#ffffff"/>
    <circle cx="84" cy="101" r="3" fill="#ffffff"/>
    <circle cx="100" cy="71" r="4.5" fill="#fef08a"/>
    <circle cx="116" cy="101" r="3" fill="#ffffff"/>
    <circle cx="128" cy="87" r="3.5" fill="#ffffff"/>

    <!-- Crown Base Band -->
    <rect x="68" y="120" width="64" height="8" rx="2" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
    <circle cx="80" cy="124" r="2" fill="#fef08a"/>
    <circle cx="100" cy="124" r="2.5" fill="#38bdf8"/>
    <circle cx="120" cy="124" r="2" fill="#fef08a"/>
  </g>
</svg>
